<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智学刷题 - 调试版</title>
<style>
  #debug-panel {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #ff4444;
    color: white;
    padding: 10px;
    font-family: monospace;
    font-size: 14px;
    z-index: 999999;
    max-height: 50vh;
    overflow-y: auto;
    display: none;
  }
  #debug-panel.show { display: block; }
  #debug-btn {
    position: fixed;
    bottom: 10px;
    right: 10px;
    z-index: 999999;
    padding: 8px 12px;
    background: #2196F3;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 12px;
  }
  #loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 18px;
    color: #666;
  }
</style>
</head>
<body>
<div id="loading">正在加载应用...</div>
<div id="root"></div>
<div id="debug-panel"></div>
<button id="debug-btn" onclick="document.getElementById('debug-panel').classList.toggle('show')">显示调试信息</button>

<script>
  var debugPanel = document.getElementById('debug-panel');
  var debugLogs = [];
  
  function addDebug(msg, type) {
    var time = new Date().toLocaleTimeString();
    var log = '[' + time + '] [' + (type || 'INFO') + '] ' + msg;
    debugLogs.push(log);
    debugPanel.innerHTML = debugLogs.join('<br>');
    console.log(log);
  }
  
  window.addEventListener('error', function(e) {
    var msg = 'JS错误: ' + (e.message || '未知错误') + ' at ' + (e.filename || '?') + ':' + (e.lineno || '?');
    addDebug(msg, 'ERROR');
    debugPanel.classList.add('show');
    document.getElementById('loading').style.display = 'none';
  });
  
  window.addEventListener('unhandledrejection', function(e) {
    var msg = 'Promise错误: ' + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason));
    addDebug(msg, 'PROMISE_ERROR');
    debugPanel.classList.add('show');
    document.getElementById('loading').style.display = 'none';
  });
  
  addDebug('页面开始加载');
  
  // 设置平台变量
  window.__platform__ = {
    appId: 'gh-pages',
    userId: 'local-user',
    env: 'runtime',
    appName: '智学刷题',
    tenantId: 'gh-pages',
  };
  window.appId = 'gh-pages';
  window.userId = 'local-user';
  window.tenantId = 'gh-pages';
  window.csrfToken = '';
  window.ENVIRONMENT = 'production';
  window.__BASENAME__ = '';
  window._appInfo = {
    name: '智学刷题',
    avatar: '',
    description: '中级会计职称刷题练习',
  };
  window.IS_MIAODA_PREVIEW = false;
  window.MIAODA_BUILTIN_TTT = '';
  
  addDebug('平台变量已设置');
  
  // 拦截平台API
  (function() {
    var noopPaths = ['/__runtime__/', '/spark/', '/ai/api/', '/app/', '/observability/', '/permissions/', '/account/', '/studio/', '/capability/', '/lark/', '/get_published', '/user_info'];
    
    function isNoopUrl(url) {
      if (!url || typeof url !== 'string') return false;
      if (url.indexOf('.js') !== -1 || url.indexOf('.css') !== -1 || url.indexOf('/assets/') !== -1) return false;
      for (var i = 0; i < noopPaths.length; i++) {
        if (url.indexOf(noopPaths[i]) !== -1) return true;
      }
      return false;
    }
    
    var originalFetch = window.fetch;
    window.fetch = function(input, init) {
      var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
      if (isNoopUrl(url)) {
        addDebug('拦截API: ' + url, 'API');
        return Promise.resolve({
          ok: true, status: 200,
          json: function() { return Promise.resolve({ code: 0, data: { roles: [], permissions: [] } }); },
          text: function() { return Promise.resolve('{"code":0,"data":{}}'); },
          headers: new Headers({ 'Content-Type': 'application/json' }),
        });
      }
      return originalFetch.apply(this, arguments);
    };
  })();
  
  addDebug('API拦截器已设置');
  
  // 加载CSS
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = './assets/main-Cw7A_0wS.css';
  link.onload = function() { addDebug('CSS加载成功'); };
  link.onerror = function() { addDebug('CSS加载失败', 'ERROR'); debugPanel.classList.add('show'); };
  document.head.appendChild(link);
  
  // 加载主JS
  var script = document.createElement('script');
  script.type = 'module';
  script.src = './assets/main-Bi4TZM8h.js';
  script.onload = function() { 
    addDebug('主JS加载成功'); 
    setTimeout(function() {
      if (document.getElementById('root').innerHTML === '') {
        addDebug('警告: root元素为空，应用可能未渲染', 'WARN');
        debugPanel.classList.add('show');
      } else {
        addDebug('应用已渲染，root内容长度: ' + document.getElementById('root').innerHTML.length);
        document.getElementById('loading').style.display = 'none';
      }
    }, 2000);
  };
  script.onerror = function() { 
    addDebug('主JS加载失败', 'ERROR'); 
    debugPanel.classList.add('show');
    document.getElementById('loading').style.display = 'none';
  };
  document.body.appendChild(script);
  
  addDebug('JS脚本已插入');
</script>
</body>
</html>
