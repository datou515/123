<style>
  #debug-panel {
    position: fixed; top: 0; left: 0; right: 0;
    background: #d32f2f; color: white; padding: 12px;
    font-family: monospace; font-size: 13px; z-index: 9999999;
    max-height: 70vh; overflow-y: auto; display: none;
    white-space: pre-wrap; word-break: break-all;
  }
  #debug-panel.show { display: block; }
  #debug-toggle {
    position: fixed; bottom: 20px; right: 20px; z-index: 9999999;
    padding: 10px 16px; background: #1976d2; color: white;
    border: none; border-radius: 6px; font-size: 14px; cursor: pointer;
  }
</style>
<div id="debug-panel"></div>
<button id="debug-toggle" onclick="document.getElementById('debug-panel').classList.toggle('show')">调试信息</button>
<script>
  var __debugPanel = document.getElementById('debug-panel');
  var __debugLogs = [];
  window.__addDebug = function(msg, type) {
    var t = new Date().toLocaleTimeString() + '.' + String(new Date().getMilliseconds()).padStart(3, '0');
    var log = '[' + t + '] [' + (type || 'INFO') + '] ' + msg;
    __debugLogs.push(log);
    __debugPanel.textContent = __debugLogs.join('\n');
    console.log('[DEBUG]', msg);
  };
  // 最先注册错误监听器，用捕获阶段
  window.addEventListener('error', function(e) {
    var msg = 'ERROR: ' + (e.message || 'unknown') + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?');
    if (e.error && e.error.stack) msg += '\nSTACK: ' + e.error.stack.substring(0, 800);
    window.__addDebug(msg, 'ERROR');
    __debugPanel.classList.add('show');
  }, true);
  window.addEventListener('unhandledrejection', function(e) {
    var msg = 'PROMISE_ERROR: ';
    if (e.reason) {
      if (e.reason.message) msg += e.reason.message;
      else if (typeof e.reason === 'string') msg += e.reason;
      else msg += JSON.stringify(e.reason).substring(0, 500);
      if (e.reason.stack) msg += '\nSTACK: ' + e.reason.stack.substring(0, 800);
    }
    window.__addDebug(msg, 'PROMISE_ERROR');
    __debugPanel.classList.add('show');
  }, true);
  // 劫持console.error
  var __origConsoleError = console.error;
  console.error = function() {
    var msg = Array.prototype.slice.call(arguments).map(function(a) {
      if (a instanceof Error) return a.message + (a.stack ? '\n' + a.stack.substring(0, 500) : '');
      return typeof a === 'object' ? JSON.stringify(a).substring(0, 300) : String(a);
    }).join(' ');
    window.__addDebug('console.error: ' + msg, 'CONSOLE_ERROR');
    __debugPanel.classList.add('show');
    __origConsoleError.apply(console, arguments);
  };
  window.__addDebug('调试脚本已加载');
</script>
<!-- 调试代码结束 -->

      function isNoopUrl(url) {
        if (!url) return false;
        if (typeof url !== 'string') {
          try { url = url.toString(); } catch(e) { return false; }
        }
        if (url.indexOf('.js') !== -1 || url.indexOf('.css') !== -1 ||
            url.indexOf('.svg') !== -1 || url.indexOf('.png') !== -1 ||
            url.indexOf('.jpg') !== -1 || url.indexOf('.ico') !== -1 ||
            url.indexOf('.woff') !== -1 || url.indexOf('.ttf') !== -1 ||
            url.indexOf('.html') !== -1 || url.indexOf('/assets/') !== -1) {
          return false;
        }
        for (var i = 0; i < noopPaths.length; i++) {
          if (url.indexOf(noopPaths[i]) !== -1) return true;
        }
        return false;
      }

      var originalFetch = window.fetch;
      window.fetch = function(input, init) {
        var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
        if (isNoopUrl(url)) {
          window.__addDebug('拦截API: ' + url, 'API');
          return Promise.resolve({
            ok: true,
            status: 200,
            statusText: 'OK',
            json: function() { return Promise.resolve({ code: 0, data: { roles: [], permissions: [] } }); },
            text: function() { return Promise.resolve('{"code":0,"data":{}}'); },
            headers: new Headers({ 'Content-Type': 'application/json' }),
          });
        }
        window.__addDebug('真实请求: ' + url, 'FETCH');
        return originalFetch.apply(this, arguments).catch(function(err) {
          window.__addDebug('请求失败: ' + url + ' - ' + err.message, 'FETCH_ERROR');
          throw err;
        });
      };

      var originalXHROpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url) {
        this._isNoop = isNoopUrl(url);
        if (!this._isNoop) window.__addDebug('真实XHR: ' + method + ' ' + url, 'XHR');
        return originalXHROpen.apply(this, arguments);
      };

      var originalXHRSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send = function() {
        if (this._isNoop) {
          Object.defineProperty(this, 'readyState', { value: 4, writable: false });
          Object.defineProperty(this, 'status', { value: 200, writable: false });
          Object.defineProperty(this, 'responseText', { value: '{"code":0,"data":{}}', writable: false });
          Object.defineProperty(this, 'response', { value: '{"code":0,"data":{}}', writable: false });
          if (typeof this.onreadystatechange === 'function') {
            try { this.onreadystatechange(); } catch(e) { window.__addDebug('XHR回调错误: ' + e.message, 'ERROR'); }
          }
          if (typeof this.onload === 'function') {
            try { this.onload(); } catch(e) { window.__addDebug('XHR onload错误: ' + e.message, 'ERROR'); }
          }
          return;
        }
        return originalXHRSend.apply(this, arguments);
      };

      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          e.stopPropagation();
          e.preventDefault();
        }
        return true;
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason === 'object' && e.reason.message &&
            (e.reason.message.indexOf('fetch') !== -1 || e.reason.message.indexOf('network') !== -1 ||
             e.reason.message.indexOf('permission') !== -1 || e.reason.message.indexOf('404') !== -1)) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
      window.__addDebug('API拦截器已设置');
    })();</script>
